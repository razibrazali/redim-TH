<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Parcel Scanner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 16px;
        touch-action: manipulation;
      }
      
      .container {
        background: white;
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 600px;
        margin: auto;
      }
      
      h1 {
        color: #333;
        margin: 0 0 8px 0;
        text-align: center;
        font-size: clamp(24px, 6vw, 32px);
      }
      
      .subtitle {
        text-align: center;
        color: #666;
        font-size: clamp(14px, 3.5vw, 16px);
        margin-bottom: 24px;
      }
      
      .scanner-box {
        position: relative;
        margin: 20px 0;
      }
      
      .scanner-box input {
        width: 100%;
        padding: 20px 60px 20px 20px;
        font-size: clamp(16px, 4vw, 20px);
        border: 3px solid #667eea;
        border-radius: 16px;
        outline: none;
        transition: all 0.3s;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
        font-weight: 500;
      }
      
      .scanner-box input:focus {
        border-color: #764ba2;
        box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.15);
      }
      
      .scanner-box input::placeholder {
        color: #999;
        font-weight: normal;
      }
      
      .barcode-icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: clamp(24px, 6vw, 32px);
        pointer-events: none;
      }
      
      .button-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 16px 0;
      }
      
      .scan-button {
        flex: 1;
        min-width: 100px;
        padding: 16px;
        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: bold;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.3s;
        touch-action: manipulation;
      }
      
      .scan-button:active {
        transform: scale(0.95);
      }
      
      .camera-button {
        background: #667eea;
        color: white;
      }
      
      .camera-button:active {
        background: #5568d3;
      }
      
      .photo-button {
        background: #6c757d;
        color: white;
      }
      
      .photo-button:active {
        background: #5a6268;
      }
      
      .submit-button {
        background: #28a745;
        color: white;
      }
      
      .submit-button:active {
        background: #218838;
      }
      
      .status-message {
        margin-top: 16px;
        padding: 16px;
        border-radius: 12px;
        text-align: center;
        font-weight: bold;
        font-size: clamp(14px, 3.5vw, 16px);
        display: none;
        animation: slideIn 0.3s ease-out;
      }
      
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .status-message.success {
        display: block;
        background: #d4edda;
        color: #155724;
        border: 2px solid #c3e6cb;
      }
      
      .status-message.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
        border: 2px solid #f5c6cb;
      }
      
      .status-message.info {
        display: block;
        background: #d1ecf1;
        color: #0c5460;
        border: 2px solid #bee5eb;
      }
      
      .scanned-data {
        margin-top: 20px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 16px;
        font-size: clamp(14px, 3.5vw, 16px);
        color: #666;
      }
      
      .scanned-data strong {
        color: #333;
        display: block;
        margin-bottom: 8px;
      }
      
      .tracking-number-display {
        font-size: clamp(18px, 5vw, 24px);
        font-weight: bold;
        color: #667eea;
        word-break: break-all;
        padding: 8px 0;
      }
      
      .hint {
        text-align: center;
        color: #999;
        font-size: clamp(12px, 3vw, 14px);
        margin-top: 20px;
        line-height: 1.5;
      }
      
      #reader {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
      }
      
      #reader video {
        border-radius: 16px;
      }
      
      @media (max-width: 480px) {
        .container {
          padding: 20px;
          border-radius: 20px;
        }
        
        .scanner-box input {
          padding: 18px 50px 18px 16px;
        }
        
        .button-container {
          flex-direction: column;
        }
        
        .scan-button {
          width: 100%;
        }
      }
      
      @media (min-width: 768px) {
        .container {
          padding: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📦 Parcel Scanner</h1>
      <p class="subtitle">Scan barcode or QR code</p>
      
      <div class="scanner-box">
        <input 
          type="text" 
          id="trackingNumber" 
          placeholder="Tracking number will appear here..."
          autocomplete="off"
          inputmode="text"
        />
        <span class="barcode-icon">📷</span>
      </div>
      
      <div class="button-container">
        <button class="scan-button camera-button" onclick="startScanner()">
          📷 Scan Code
        </button>
        <button class="scan-button photo-button" onclick="scanFromFile()">
          📁 From Photo
        </button>
        <button class="scan-button submit-button" onclick="submitManual()">
          ✓ Submit
        </button>
      </div>
      
      <div id="statusMessage" class="status-message"></div>
      
      <div class="scanned-data" id="scannedData">
        <strong>Last Scanned:</strong>
        <div class="tracking-number-display" id="lastTracking">None</div>
      </div>
      
      <div class="hint">
        💡 Scan barcode or QR code using camera<br>
        Or type manually and press Submit
      </div>
      
      <!-- Scanner area (hidden by default) -->
      <div id="scannerArea" style="display: none; margin-top: 20px;">
        <div id="reader"></div>
        <button class="scan-button" onclick="stopScanner()" style="background: #dc3545; color: white; width: 100%; margin-top: 10px;">
          ✕ Cancel
        </button>
      </div>
    </div>

    <!-- html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <script>
      // CONFIGURATION - Replace with your Google Apps Script Web App URL
      const GOOGLE_SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
      
      const input = document.getElementById('trackingNumber');
      const statusMessage = document.getElementById('statusMessage');
      const lastTracking = document.getElementById('lastTracking');
      const scannerArea = document.getElementById('scannerArea');
      
      let html5QrCode = null;
      let isScanning = false;
      
      // Auto-focus on load
      input.focus();
      
      // Handle Enter key press
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && this.value.trim() !== '') {
          handleTrackingNumber(this.value.trim());
        }
      });
      
      // Handle paste event
      input.addEventListener('paste', function(e) {
        setTimeout(function() {
          if (input.value.trim() !== '') {
            handleTrackingNumber(input.value.trim());
          }
        }, 100);
      });
      
      function submitManual() {
        if (input.value.trim() !== '') {
          handleTrackingNumber(input.value.trim());
        } else {
          showStatus('Please enter a tracking number first', 'error');
          input.focus();
        }
      }
      
      function handleTrackingNumber(trackingNumber) {
        showStatus('Processing...', 'info');
        input.disabled = true;
        
        // Save to Google Sheets via Apps Script
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            action: 'saveTrackingNumber',
            trackingNumber: trackingNumber
          })
        })
        .then(() => {
          // With no-cors, we can't read the response
          // Assume success
          input.disabled = false;
          lastTracking.textContent = trackingNumber;
          showStatus('Tracking number ' + trackingNumber + ' saved successfully!', 'success');
          
          input.value = '';
          input.focus();
          
          if (navigator.vibrate) {
            navigator.vibrate(100);
          }
          
          setTimeout(function() {
            hideStatus();
          }, 3000);
        })
        .catch(error => {
          input.disabled = false;
          showStatus('Error: ' + error.message, 'error');
          input.focus();
        });
      }
      
      function showStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = 'status-message ' + type;
        statusMessage.style.display = 'block';
      }
      
      function hideStatus() {
        statusMessage.style.display = 'none';
      }
      
      // Camera scanner functions
      async function startScanner() {
        if (isScanning) {
          await stopScanner();
          return;
        }
        
        try {
          // Show scanner area
          scannerArea.style.display = 'block';
          
          // Create scanner instance
          html5QrCode = new Html5Qrcode("reader");
          
          const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.QR_CODE,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODABAR,
              Html5QrcodeSupportedFormats.ITF
            ]
          };
          
          await html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanFailure
          );
          
          isScanning = true;
          
        } catch (error) {
          console.error('Camera error:', error);
          scannerArea.style.display = 'none';
          
          let errorMessage = 'Unable to access camera. ';
          
          if (error.name === 'NotAllowedError' || error.message.includes('permission')) {
            errorMessage += 'Camera permission denied. Please allow camera access in your browser settings.';
          } else if (error.name === 'NotFoundError') {
            errorMessage += 'No camera found on this device.';
          } else if (error.name === 'NotReadableError') {
            errorMessage += 'Camera is already in use by another application.';
          } else {
            errorMessage += error.message;
          }
          
          alert(errorMessage);
          input.focus();
        }
      }
      
      function onScanSuccess(decodedText, decodedResult) {
        stopScanner();
        
        input.value = decodedText;
        handleTrackingNumber(decodedText);
        
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]);
        }
      }
      
      function onScanFailure(error) {
        // Silent failure - no code detected yet
      }
      
      async function stopScanner() {
        if (html5QrCode && isScanning) {
          try {
            await html5QrCode.stop();
            await html5QrCode.clear();
          } catch (e) {
            console.log('Error stopping scanner:', e);
          }
          html5QrCode = null;
          isScanning = false;
        }
        scannerArea.style.display = 'none';
        input.focus();
      }
      
      // Scan from file
      function scanFromFile() {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.capture = 'environment';
        
        fileInput.onchange = function(e) {
          const file = e.target.files[0];
          if (file) {
            showStatus('Decoding code...', 'info');
            
            const tempScanner = new Html5Qrcode("tempScanner");
            
            const tempContainer = document.createElement('div');
            tempContainer.id = 'tempScanner';
            tempContainer.style.display = 'none';
            document.body.appendChild(tempContainer);
            
            tempScanner.scanFile(file, true)
              .then(decodedText => {
                tempScanner.clear();
                tempContainer.remove();
                
                input.value = decodedText;
                handleTrackingNumber(decodedText);
                
                if (navigator.vibrate) {
                  navigator.vibrate([100, 50, 100]);
                }
              })
              .catch(err => {
                console.error('Scan error:', err);
                tempScanner.clear();
                tempContainer.remove();
                
                showStatus('No code found in image. Please try again.', 'error');
                setTimeout(function() {
                  hideStatus();
                }, 3000);
              });
          }
        };
        
        fileInput.click();
      }
      
      // Keep focus on input
      document.querySelector('.container').addEventListener('click', function(e) {
        if (e.target.tagName !== 'BUTTON' && !scannerArea.contains(e.target)) {
          input.focus();
        }
      });
    </script>
  </body>
</html>
