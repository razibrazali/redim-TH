<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Parcel Scanner</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1e40af;
        --primary-light: #dbeafe;
        --success: #10b981;
        --success-light: #d1fae5;
        --warning: #f59e0b;
        --danger: #ef4444;
        --gray-50: #f9fafb;
        --gray-100: #f3f4f6;
        --gray-200: #e5e7eb;
        --gray-300: #d1d5db;
        --gray-400: #9ca3af;
        --gray-500: #6b7280;
        --gray-600: #4b5563;
        --gray-700: #374151;
        --gray-800: #1f2937;
        --gray-900: #111827;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 16px;
        touch-action: manipulation;
      }
      
      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        width: 100%;
        max-width: 500px;
        margin: auto;
        overflow: hidden;
      }
      
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 24px 24px 20px;
        text-align: center;
        position: relative;
      }
      
      .header-icon {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        font-size: 30px;
        backdrop-filter: blur(10px);
      }
      
      .header h1 {
        color: white;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      
      .header p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
      }
      
      .progress-bar {
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        margin-top: 16px;
        border-radius: 2px;
        overflow: hidden;
      }
      
      .progress-fill {
        height: 100%;
        background: white;
        width: 33.33%;
        border-radius: 2px;
        transition: width 0.3s ease;
      }
      
      .content {
        padding: 24px;
      }
      
      .step-indicator {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }
      
      .step-number {
        width: 32px;
        height: 32px;
        background: var(--primary);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
        margin-right: 12px;
      }
      
      .step-text {
        font-weight: 600;
        color: var(--gray-800);
        font-size: 16px;
      }
      
      .form-group {
        margin-bottom: 20px;
      }
      
      .form-label {
        display: block;
        font-weight: 600;
        color: var(--gray-700);
        margin-bottom: 8px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      
      .scanner-box {
        position: relative;
      }
      
      .scanner-box input {
        width: 100%;
        padding: 16px 50px 16px 16px;
        font-size: 16px;
        border: 2px solid var(--gray-300);
        border-radius: 12px;
        outline: none;
        transition: all 0.3s;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
        font-weight: 500;
        background: var(--gray-50);
      }
      
      .scanner-box input:focus {
        border-color: var(--primary);
        background: white;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      
      .scanner-box input::placeholder {
        color: var(--gray-400);
        font-weight: normal;
      }
      
      .scanner-box input.filled {
        border-color: var(--success);
        background: var(--success-light);
      }
      
      .scanner-status {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        pointer-events: none;
      }
      
      .scanner-status.success {
        color: var(--success);
      }
      
      .button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      
      .button-full {
        grid-column: 1 / -1;
      }
      
      .action-button {
        padding: 14px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
      }
      
      .action-button:active {
        transform: scale(0.97);
      }
      
      .action-button.primary {
        background: var(--primary);
        color: white;
      }
      
      .action-button.primary:hover {
        background: var(--primary-dark);
      }
      
      .action-button.secondary {
        background: var(--gray-100);
        color: var(--gray-700);
      }
      
      .action-button.secondary:hover {
        background: var(--gray-200);
      }
      
      .action-button.success {
        background: var(--success);
        color: white;
      }
      
      .action-button.success:hover {
        background: #059669;
      }
      
      .action-button.danger {
        background: var(--danger);
        color: white;
      }
      
      .action-button.danger:hover {
        background: #dc2626;
      }
      
      .action-button .icon {
        font-size: 20px;
      }
      
      .status-message {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 10px;
        text-align: center;
        font-weight: 500;
        font-size: 14px;
        display: none;
        animation: slideIn 0.3s ease-out;
      }
      
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .status-message.success {
        display: block;
        background: var(--success-light);
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      
      .status-message.error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
      
      .status-message.info {
        display: block;
        background: var(--primary-light);
        color: #1e40af;
        border: 1px solid #bfdbfe;
      }
      
      .helper-text {
        text-align: center;
        color: var(--gray-400);
        font-size: 12px;
        margin-top: 16px;
        line-height: 1.5;
      }
      
      /* Full-screen camera overlay */
      .camera-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.97);
        z-index: 9999;
        flex-direction: column;
      }
      
      .camera-overlay.active {
        display: flex;
      }
      
      .camera-header {
        padding: 20px;
        color: white;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      
      .camera-body {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      
      #reader {
        width: 100%;
        height: 100%;
        position: relative;
      }
      
      #reader video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
      }
      
      .camera-guide {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 250px;
        height: 250px;
        border: 3px solid #10b981;
        border-radius: 20px;
        pointer-events: none;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0%, 100% {
          border-color: #10b981;
        }
        50% {
          border-color: #34d399;
        }
      }
      
      .focus-hint {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 14px;
        font-weight: 500;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 16px;
        border-radius: 20px;
        pointer-events: none;
        animation: fadeInOut 2s infinite;
      }
      
      @keyframes fadeInOut {
        0%, 100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
        }
      }
      
      .camera-footer {
        padding: 20px;
        background: rgba(0, 0, 0, 0.5);
      }
      
      .camera-cancel {
        width: 100%;
        padding: 14px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      
      .camera-cancel:active {
        background: rgba(255, 255, 255, 0.2);
      }
      
      @media (max-width: 480px) {
        .content {
          padding: 20px;
        }
        
        .button-grid {
          grid-template-columns: 1fr;
        }
        
        .button-full {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-icon">📦</div>
        <h1>Parcel Scanner 6:17</h1>
        <p>Scan and track your parcels</p>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
      
      <div class="content">
        <div class="step-indicator">
          <div class="step-number">1</div>
          <div class="step-text">Enter Tracking Number</div>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="trackingNumber">Tracking Number</label>
          <div class="scanner-box">
            <input 
              type="text" 
              id="trackingNumber" 
              placeholder="Scan or type tracking number..."
              autocomplete="off"
              inputmode="text"
            />
            <span class="scanner-status" id="scannerStatus">📷</span>
          </div>
        </div>
        
        <div class="button-grid">
          <button class="action-button primary" onclick="startScanner()">
            <span class="icon">📷</span>
            Scan Code
          </button>
          <button class="action-button secondary" onclick="scanFromFile()">
            <span class="icon">📁</span>
            From Photo
          </button>
          <button class="action-button danger button-full" onclick="clearTrackingNumber()" id="clearButton" style="display: none;">
            <span class="icon">✕</span>
            Clear Tracking Number
          </button>
        </div>
        
        <div id="statusMessage" class="status-message"></div>
        
        <div class="helper-text">
          💡 USB scanner: Just scan the code<br>
          📱 Phone: Use "Scan Code" button for camera
        </div>
      </div>
    </div>

    <!-- Full-screen camera overlay -->
    <div class="camera-overlay" id="cameraOverlay">
      <div class="camera-header">
        📷 Point camera at barcode or QR code
      </div>
      <div class="camera-body" id="cameraBody">
        <div id="reader"></div>
        <div class="camera-guide"></div>
        <div class="focus-hint">👆 Tap screen to focus</div>
      </div>
      <div class="camera-footer">
        <button class="camera-cancel" onclick="stopScanner()">
          ✕ Cancel
        </button>
      </div>
    </div>

    <!-- html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <script>
      const input = document.getElementById('trackingNumber');
      const statusMessage = document.getElementById('statusMessage');
      const cameraOverlay = document.getElementById('cameraOverlay');
      const scannerStatus = document.getElementById('scannerStatus');
      const clearButton = document.getElementById('clearButton');
      const cameraBody = document.getElementById('cameraBody');
      
      let html5QrCode = null;
      let isScanning = false;
      let lastScannedValue = '';
      let lastScanTime = 0;
      
      // Create audio context for beep sound
      let audioContext = null;
      
      function playBeepSound() {
        try {
          // Create audio context if not exists
          if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          
          // Resume context if suspended (mobile browsers)
          if (audioContext.state === 'suspended') {
            audioContext.resume();
          }
          
          // Create oscillator for beep
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          // Connect oscillator to gain node and gain node to speakers
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          // Set beep frequency (like supermarket scanner)
          oscillator.frequency.value = 2000; // High-pitched beep
          oscillator.type = 'square'; // Sharp sound
          
          // Set volume
          gainNode.gain.value = 0.3;
          
          // Play beep
          oscillator.start();
          
          // Stop after 100ms
          setTimeout(function() {
            oscillator.stop();
          }, 100);
          
        } catch (e) {
          console.log('Audio not available:', e);
        }
      }
      
      // Auto-focus on load
      input.focus();
      
      // Handle Enter key press (for USB scanners)
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && this.value.trim() !== '') {
          // Check for duplicate scan (some scanners send Enter twice)
          const now = Date.now();
          if (this.value.trim() === lastScannedValue && now - lastScanTime < 500) {
            return; // Ignore duplicate
          }
          
          lastScannedValue = this.value.trim();
          lastScanTime = now;
          
          // USB scanner detected - play beep and mark as filled
          playBeepSound();
          markAsFilled();
        }
      });
      
      // Handle paste event
      input.addEventListener('paste', function(e) {
        setTimeout(function() {
          if (input.value.trim() !== '') {
            playBeepSound();
            markAsFilled();
          }
        }, 100);
      });
      
      // Handle manual typing
      input.addEventListener('input', function() {
        if (this.value.trim() !== '') {
          markAsFilled();
        } else {
          removeFilled();
        }
      });
      
      // Handle blur (when scanner finishes)
      input.addEventListener('blur', function() {
        if (this.value.trim() !== '') {
          markAsFilled();
        }
      });
      
      function markAsFilled() {
        input.classList.add('filled');
        scannerStatus.textContent = '✅';
        scannerStatus.classList.add('success');
        clearButton.style.display = 'block';
        showStatus('✅ Tracking number captured successfully!', 'success');
        
        // Vibrate for feedback
        if (navigator.vibrate) {
          navigator.vibrate(100);
        }
        
        // Hide status after 2 seconds
        setTimeout(function() {
          hideStatus();
        }, 2000);
      }
      
      function removeFilled() {
        input.classList.remove('filled');
        scannerStatus.textContent = '📷';
        scannerStatus.classList.remove('success');
        clearButton.style.display = 'none';
      }
      
      function clearTrackingNumber() {
        input.value = '';
        removeFilled();
        input.focus();
        hideStatus();
      }
      
      function showStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = 'status-message ' + type;
        statusMessage.style.display = 'block';
      }
      
      function hideStatus() {
        statusMessage.style.display = 'none';
      }
      
      // Full-screen camera scanner
      async function startScanner() {
        if (isScanning) {
          await stopScanner();
          return;
        }
        
        try {
          // Show full-screen overlay
          cameraOverlay.classList.add('active');
          
          // Create scanner instance
          html5QrCode = new Html5Qrcode("reader");
          
          const config = {
            fps: 15,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0,
            formatsToSupport: [
              Html5QrcodeSupportedFormats.QR_CODE,
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODABAR,
              Html5QrcodeSupportedFormats.ITF
            ]
          };
          
          await html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanFailure
          );
          
          isScanning = true;
          
        } catch (error) {
          console.error('Camera error:', error);
          cameraOverlay.classList.remove('active');
          
          let errorMessage = 'Unable to access camera. ';
          
          if (error.name === 'NotAllowedError' || error.message.includes('permission')) {
            errorMessage += 'Camera permission denied. Please allow camera access in your browser settings.';
          } else if (error.name === 'NotFoundError') {
            errorMessage += 'No camera found on this device.';
          } else if (error.name === 'NotReadableError') {
            errorMessage += 'Camera is already in use by another application.';
          } else {
            errorMessage += error.message;
          }
          
          alert(errorMessage);
          input.focus();
        }
      }
      
      function onScanSuccess(decodedText, decodedResult) {
        stopScanner();
        
        // Play beep sound
        playBeepSound();
        
        // Fill the input with scanned value
        input.value = decodedText;
        markAsFilled();
        
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]);
        }
      }
      
      function onScanFailure(error) {
        // Silent failure - no code detected yet
      }
      
      async function stopScanner() {
        if (html5QrCode && isScanning) {
          try {
            await html5QrCode.stop();
            await html5QrCode.clear();
          } catch (e) {
            console.log('Error stopping scanner:', e);
          }
          html5QrCode = null;
          isScanning = false;
        }
        cameraOverlay.classList.remove('active');
        input.focus();
      }
      
      // Manual focus trigger - tap on screen to focus
      cameraBody.addEventListener('click', async function() {
        try {
          const videoElement = document.querySelector('#reader video');
          if (videoElement && videoElement.srcObject) {
            const videoTrack = videoElement.srcObject.getVideoTracks()[0];
            if (videoTrack && videoTrack.getCapabilities) {
              const capabilities = videoTrack.getCapabilities();
              
              if (capabilities.focusMode) {
                const focusModes = capabilities.focusMode;
                
                // Try continuous autofocus first
                if (focusModes.includes('continuous')) {
                  await videoTrack.applyConstraints({
                    advanced: [{ focusMode: 'continuous' }]
                  });
                } else if (focusModes.includes('auto')) {
                  await videoTrack.applyConstraints({
                    advanced: [{ focusMode: 'auto' }]
                  });
                }
                
                // Visual feedback
                showFocusFeedback();
              }
            }
          }
        } catch (error) {
          console.log('Manual focus not supported:', error);
        }
      });
      
      function showFocusFeedback() {
        // Flash the guide box
        const guide = document.querySelector('.camera-guide');
        guide.style.borderColor = '#ffffff';
        guide.style.transition = 'border-color 0.3s';
        
        setTimeout(() => {
          guide.style.borderColor = '#10b981';
        }, 300);
      }
      
      // Scan from file
      function scanFromFile() {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.capture = 'environment';
        
        fileInput.onchange = function(e) {
          const file = e.target.files[0];
          if (file) {
            showStatus('Decoding code...', 'info');
            
            const tempScanner = new Html5Qrcode("tempScanner");
            
            const tempContainer = document.createElement('div');
            tempContainer.id = 'tempScanner';
            tempContainer.style.display = 'none';
            document.body.appendChild(tempContainer);
            
            tempScanner.scanFile(file, true)
              .then(decodedText => {
                tempScanner.clear();
                tempContainer.remove();
                
                // Play beep sound
                playBeepSound();
                
                input.value = decodedText;
                markAsFilled();
                
                if (navigator.vibrate) {
                  navigator.vibrate([100, 50, 100]);
                }
              })
              .catch(err => {
                console.error('Scan error:', err);
                tempScanner.clear();
                tempContainer.remove();
                
                showStatus('No code found in image. Please try again.', 'error');
                setTimeout(function() {
                  hideStatus();
                }, 3000);
              });
          }
        };
        
        fileInput.click();
      }
      
      // Keep focus on input when clicking anywhere in the container
      document.querySelector('.container').addEventListener('click', function(e) {
        if (e.target.tagName !== 'BUTTON') {
          input.focus();
        }
      });
    </script>
  </body>
</html>
