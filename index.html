<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Parcel Scanner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 16px;
        touch-action: manipulation;
      }
      
      .container {
        background: white;
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 600px;
        margin: auto;
      }
      
      h1 {
        color: #333;
        margin: 0 0 8px 0;
        text-align: center;
        font-size: clamp(24px, 6vw, 32px);
      }
      
      .subtitle {
        text-align: center;
        color: #666;
        font-size: clamp(14px, 3.5vw, 16px);
        margin-bottom: 24px;
      }
      
      .form-group {
        margin: 20px 0;
      }
      
      .form-label {
        display: block;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
        font-size: clamp(16px, 4vw, 18px);
      }
      
      .scanner-box {
        position: relative;
      }
      
      .scanner-box input {
        width: 100%;
        padding: 20px 60px 20px 20px;
        font-size: clamp(16px, 4vw, 20px);
        border: 3px solid #667eea;
        border-radius: 16px;
        outline: none;
        transition: all 0.3s;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
        font-weight: 500;
      }
      
      .scanner-box input:focus {
        border-color: #764ba2;
        box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.15);
      }
      
      .scanner-box input::placeholder {
        color: #999;
        font-weight: normal;
      }
      
      .scanner-box input.filled {
        border-color: #28a745;
        background: #f0fff4;
      }
      
      .barcode-icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: clamp(24px, 6vw, 32px);
        pointer-events: none;
      }
      
      .button-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 16px 0;
      }
      
      .scan-button {
        flex: 1;
        min-width: 100px;
        padding: 16px;
        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: bold;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.3s;
        touch-action: manipulation;
      }
      
      .scan-button:active {
        transform: scale(0.95);
      }
      
      .camera-button {
        background: #667eea;
        color: white;
      }
      
      .camera-button:active {
        background: #5568d3;
      }
      
      .photo-button {
        background: #6c757d;
        color: white;
      }
      
      .photo-button:active {
        background: #5a6268;
      }
      
      .clear-button {
        background: #ffc107;
        color: #333;
      }
      
      .clear-button:active {
        background: #e0a800;
      }
      
      .status-message {
        margin-top: 16px;
        padding: 16px;
        border-radius: 12px;
        text-align: center;
        font-weight: bold;
        font-size: clamp(14px, 3.5vw, 16px);
        display: none;
        animation: slideIn 0.3s ease-out;
      }
      
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .status-message.success {
        display: block;
        background: #d4edda;
        color: #155724;
        border: 2px solid #c3e6cb;
      }
      
      .status-message.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
        border: 2px solid #f5c6cb;
      }
      
      .status-message.info {
        display: block;
        background: #d1ecf1;
        color: #0c5460;
        border: 2px solid #bee5eb;
      }
      
      .hint {
        text-align: center;
        color: #999;
        font-size: clamp(12px, 3vw, 14px);
        margin-top: 20px;
        line-height: 1.5;
      }
      
      /* Full-screen camera overlay */
      .camera-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 9999;
        flex-direction: column;
      }
      
      .camera-overlay.active {
        display: flex;
      }
      
      .camera-header {
        padding: 20px;
        color: white;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.5);
      }
      
      .camera-body {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      
      #reader {
        width: 100%;
        height: 100%;
        position: relative;
      }
      
      #reader video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
      }
      
      .camera-guide {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 250px;
        height: 250px;
        border: 3px solid #00ff00;
        border-radius: 20px;
        pointer-events: none;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      }
      
      .camera-footer {
        padding: 20px;
        background: rgba(0, 0, 0, 0.5);
      }
      
      .camera-cancel {
        width: 100%;
        padding: 16px;
        background: #dc3545;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
      }
      
      .camera-cancel:active {
        background: #c82333;
      }
      
      @media (max-width: 480px) {
        .container {
          padding: 20px;
          border-radius: 20px;
        }
        
        .scanner-box input {
          padding: 18px 50px 18px 16px;
        }
        
        .button-container {
          flex-direction: column;
        }
        
        .scan-button {
          width: 100%;
        }
      }
      
      @media (min-width: 768px) {
        .container {
          padding: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📦 Parcel Scanner</h1>
      <p class="subtitle">Step 1: Enter Tracking Number</p>
      
      <div class="form-group">
        <label class="form-label" for="trackingNumber">Tracking Number</label>
        <div class="scanner-box">
          <input 
            type="text" 
            id="trackingNumber" 
            placeholder="Scan or type tracking number..."
            autocomplete="off"
            inputmode="text"
          />
          <span class="barcode-icon">📷</span>
        </div>
      </div>
      
      <div class="button-container">
        <button class="scan-button camera-button" onclick="startScanner()">
          📷 Scan Code
        </button>
        <button class="scan-button photo-button" onclick="scanFromFile()">
          📁 From Photo
        </button>
        <button class="scan-button clear-button" onclick="clearTrackingNumber()">
          ✕ Clear
        </button>
      </div>
      
      <div id="statusMessage" class="status-message"></div>
      
      <div class="hint">
        💡 USB scanner: Just scan the code<br>
        📱 Phone: Use "Scan Code" button for camera
      </div>
    </div>

    <!-- Full-screen camera overlay -->
    <div class="camera-overlay" id="cameraOverlay">
      <div class="camera-header">
        📷 Point camera at barcode or QR code
      </div>
      <div class="camera-body">
        <div id="reader"></div>
        <div class="camera-guide"></div>
      </div>
      <div class="camera-footer">
        <button class="camera-cancel" onclick="stopScanner()">✕ Cancel</button>
      </div>
    </div>

    <!-- html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <script>
      const input = document.getElementById('trackingNumber');
      const statusMessage = document.getElementById('statusMessage');
      const cameraOverlay = document.getElementById('cameraOverlay');
      
      let html5QrCode = null;
      let isScanning = false;
      
      // Auto-focus on load
      input.focus();
      
      // Handle Enter key press (for USB scanners)
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && this.value.trim() !== '') {
          // USB scanner detected - just mark as filled
          markAsFilled();
        }
      });
      
      // Handle paste event
      input.addEventListener('paste', function(e) {
        setTimeout(function() {
          if (input.value.trim() !== '') {
            markAsFilled();
          }
        }, 100);
      });
      
      // Handle manual typing
      input.addEventListener('input', function() {
        if (this.value.trim() !== '') {
          markAsFilled();
        } else {
          removeFilled();
        }
      });
      
      // Handle blur (when scanner finishes)
      input.addEventListener('blur', function() {
        if (this.value.trim() !== '') {
          markAsFilled();
        }
      });
      
      function markAsFilled() {
        input.classList.add('filled');
        showStatus('✅ Tracking number captured: ' + input.value.trim(), 'success');
        
        // Vibrate for feedback
        if (navigator.vibrate) {
          navigator.vibrate(100);
        }
        
        // Hide status after 2 seconds
        setTimeout(function() {
          hideStatus();
        }, 2000);
      }
      
      function removeFilled() {
        input.classList.remove('filled');
      }
      
      function clearTrackingNumber() {
        input.value = '';
        input.classList.remove('filled');
        input.focus();
        hideStatus();
      }
      
      function showStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = 'status-message ' + type;
        statusMessage.style.display = 'block';
      }
      
      function hideStatus() {
        statusMessage.style.display = 'none';
      }
      
      // Full-screen camera scanner
      async function startScanner() {
        if (isScanning) {
          await stopScanner();
          return;
        }
        
        try {
          // Show full-screen overlay
          cameraOverlay.classList.add('active');
          
          // Create scanner instance
          html5QrCode = new Html5Qrcode("reader");
          
          const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.QR_CODE,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODABAR,
              Html5QrcodeSupportedFormats.ITF
            ]
          };
          
          await html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanFailure
          );
          
          isScanning = true;
          
        } catch (error) {
          console.error('Camera error:', error);
          cameraOverlay.classList.remove('active');
          
          let errorMessage = 'Unable to access camera. ';
          
          if (error.name === 'NotAllowedError' || error.message.includes('permission')) {
            errorMessage += 'Camera permission denied. Please allow camera access in your browser settings.';
          } else if (error.name === 'NotFoundError') {
            errorMessage += 'No camera found on this device.';
          } else if (error.name === 'NotReadableError') {
            errorMessage += 'Camera is already in use by another application.';
          } else {
            errorMessage += error.message;
          }
          
          alert(errorMessage);
          input.focus();
        }
      }
      
      function onScanSuccess(decodedText, decodedResult) {
        stopScanner();
        
        // Fill the input with scanned value
        input.value = decodedText;
        markAsFilled();
        
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]);
        }
      }
      
      function onScanFailure(error) {
        // Silent failure - no code detected yet
      }
      
      async function stopScanner() {
        if (html5QrCode && isScanning) {
          try {
            await html5QrCode.stop();
            await html5QrCode.clear();
          } catch (e) {
            console.log('Error stopping scanner:', e);
          }
          html5QrCode = null;
          isScanning = false;
        }
        cameraOverlay.classList.remove('active');
        input.focus();
      }
      
      // Scan from file
      function scanFromFile() {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.capture = 'environment';
        
        fileInput.onchange = function(e) {
          const file = e.target.files[0];
          if (file) {
            showStatus('Decoding code...', 'info');
            
            const tempScanner = new Html5Qrcode("tempScanner");
            
            const tempContainer = document.createElement('div');
            tempContainer.id = 'tempScanner';
            tempContainer.style.display = 'none';
            document.body.appendChild(tempContainer);
            
            tempScanner.scanFile(file, true)
              .then(decodedText => {
                tempScanner.clear();
                tempContainer.remove();
                
                input.value = decodedText;
                markAsFilled();
                
                if (navigator.vibrate) {
                  navigator.vibrate([100, 50, 100]);
                }
              })
              .catch(err => {
                console.error('Scan error:', err);
                tempScanner.clear();
                tempContainer.remove();
                
                showStatus('No code found in image. Please try again.', 'error');
                setTimeout(function() {
                  hideStatus();
                }, 3000);
              });
          }
        };
        
        fileInput.click();
      }
      
      // Keep focus on input when clicking anywhere in the container
      document.querySelector('.container').addEventListener('click', function(e) {
        if (e.target.tagName !== 'BUTTON') {
          input.focus();
        }
      });
    </script>
  </body>
</html>
